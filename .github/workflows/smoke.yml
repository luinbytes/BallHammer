name: Smoke

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua interpreters
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y lua5.4 luajit
      - name: Run smoke tests
        run: |
          set -euo pipefail
          for interpreter in lua5.4 luajit; do
            for test in tests/*_smoke.lua; do
              "$interpreter" "$test"
            done
          done
      - name: Compile production modules
        run: bash tests/runtime_compile_smoke.sh
      - name: Check diff
        run: git diff --check
